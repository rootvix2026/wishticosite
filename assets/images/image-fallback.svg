  <title id="title">WishTico premium image placeholder</title>
  <desc id="desc">A premium WishTico branded gradient placeholder used when a remote fashion image cannot be loaded.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f1e8" />
      <stop offset="55%" stop-color="#efe4d3" />
      <stop offset="100%" stop-color="#d8c2a0" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#3e3327" stop-opacity="0.88" />
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)" />
  <circle cx="1020" cy="170" r="180" fill="#ffffff" opacity="0.35" />
  <circle cx="180" cy="760" r="220" fill="#ffffff" opacity="0.2" />
  <rect x="110" y="135" width="980" height="630" rx="48" fill="url(#panel)" opacity="0.94" />
