<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WISHTICO Product</title>
    <meta name="description" content="Shop premium WISHTICO product details, reviews, related styles, and luxury checkout actions." />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="product">
    <div data-site-header></div>
    <div data-search-overlay></div>
    <main>
      <section class="page-hero page-hero--compact">
        <div class="container reveal">
          <div class="breadcrumb" id="product-breadcrumb">Home / Product</div>
        </div>
      </section>
      <section class="section section--compact">
        <div class="container" id="product-detail-root"></div>
      </section>
      <section class="section section--muted">
        <div class="container">
          <div class="product-tabs reveal">
            <button class="tab-button is-active" type="button" data-tab-target="description">Description</button>
            <button class="tab-button" type="button" data-tab-target="reviews">Reviews</button>
          </div>
          <div class="tab-panel is-active reveal" id="tab-description"></div>
          <div class="tab-panel reveal" id="tab-reviews">
            <div class="review-grid" id="product-review-grid"></div>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="section-head reveal">
            <span class="eyebrow">Related products</span>
            <h2>You may also like</h2>
          </div>
          <div class="product-grid" id="related-products"></div>
        </div>
      </section>
    </main>
    <div data-cart-drawer></div>
    <div data-site-footer></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
