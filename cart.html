<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WISHTICO Cart</title>
    <meta name="description" content="Review your WISHTICO cart, apply offers, and proceed to a luxury checkout experience." />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="cart">
    <div data-site-header></div>
    <div data-search-overlay></div>
    <main>
      <section class="page-hero page-hero--compact">
        <div class="container reveal">
          <div class="breadcrumb">Home / Cart</div>
          <h1>Your Cart</h1>
          <p>Polished picks saved for checkout.</p>
        </div>
      </section>
      <section class="section section--compact">
        <div class="container cart-layout">
          <div class="cart-list" id="cart-page-items"></div>
          <aside class="summary-card reveal">
            <h2>Order Summary</h2>
            <div class="coupon-box">
              <label for="coupon-code">Coupon code</label>
              <div class="coupon-row">
                <input id="coupon-code" type="text" placeholder="Enter coupon code" />
                <button class="button button-secondary" id="apply-coupon" type="button">Apply</button>
              </div>
            </div>
            <dl class="summary-list">
              <div><dt>Subtotal</dt><dd id="cart-subtotal">₹0</dd></div>
              <div><dt>Delivery</dt><dd id="cart-delivery">₹0</dd></div>
              <div><dt>Discount</dt><dd id="cart-discount">₹0</dd></div>
              <div class="summary-total"><dt>Total</dt><dd id="cart-total">₹0</dd></div>
            </dl>
            <a class="button button-primary button-block" id="checkout-button" href="checkout.html">Proceed to Checkout</a>
          </aside>
        </div>
      </section>
    </main>
    <div data-cart-drawer></div>
    <div data-site-footer></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
