<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WISHTICO Sign Up</title>
    <meta name="description" content="Create a WISHTICO account for premium shopping, order tracking, and wishlist sync." />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="signup" class="auth-page">
    <div data-site-header></div>
    <div data-search-overlay></div>
    <main class="auth-shell">
      <section class="auth-card reveal">
        <span class="eyebrow">Create account</span>
        <h1>Join WISHTICO</h1>
        <p class="auth-note">Create your account for faster checkout, wishlist saves, and order history.</p>
        <p class="auth-feedback" id="auth-feedback" hidden aria-live="polite"></p>
        <form id="signup-form" class="form-grid">
          <label class="field"><span>Full name</span><input name="name" type="text" required /></label>
          <label class="field"><span>Email</span><input name="email" type="email" required /></label>
          <label class="field password-field"><span>Password</span><input name="password" type="password" minlength="6" required /><button class="password-toggle" type="button" data-password-toggle>Show</button></label>
          <button class="button button-primary button-block" type="submit">Create Account</button>
        </form>
        <button class="button button-secondary button-block" id="google-signup" type="button">Continue with Google</button>
        <p class="auth-switch">Already have an account? <a id="login-link" href="login.html">Login</a></p>
      </section>
    </main>
    <div data-cart-drawer></div>
    <div data-site-footer></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
