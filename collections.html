<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WISHTICO Collections</title>
    <meta name="description" content="Browse premium WISHTICO collections with luxury filters, wishlist, search, and quick add actions." />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="collections">
    <div data-site-header></div>
    <div data-search-overlay></div>
    <main>
      <section class="page-hero page-hero--compact">
        <div class="container reveal">
          <div class="breadcrumb">Home / Collections</div>
          <h1>Collections</h1>
          <p>Luxury essentials, sharp silhouettes, and premium offer drops in one refined catalogue.</p>
        </div>
      </section>

      <section class="section section--compact">
        <div class="container catalog-layout">
          <aside class="filter-card reveal">
            <div class="filter-block">
              <h3>Categories</h3>
              <div class="filter-stack" id="category-filter-list"></div>
            </div>
            <div class="filter-block">
              <h3>Size</h3>
              <div class="chip-group" id="size-filter-group"></div>
            </div>
            <div class="filter-block">
              <h3>Color</h3>
              <div class="swatch-group" id="color-filter-group"></div>
            </div>
            <div class="filter-block">
              <h3>Price range</h3>
              <input id="price-range" type="range" min="499" max="4999" step="100" value="4999" />
              <div class="range-output" id="price-range-output">Up to ₹4,999</div>
            </div>
            <div class="button-group button-group--stack">
              <button class="button button-primary" id="apply-filters" type="button">Apply</button>
              <button class="button button-secondary" id="clear-filters" type="button">Clear</button>
            </div>
          </aside>

          <div>
            <div class="catalog-toolbar reveal">
              <div>
                <span class="eyebrow">Catalog</span>
                <h2 id="collection-heading">All Products</h2>
                <p><span id="collection-count">0</span> products available</p>
              </div>
              <label class="select-field">
                <span>Sort by</span>
                <select id="sort-select">
                  <option value="popular">Popular</option>
                  <option value="newest">Newest</option>
                  <option value="price-asc">Price Low → High</option>
                  <option value="price-desc">Price High → Low</option>
                </select>
              </label>
            </div>
            <div class="product-grid" id="collection-grid"></div>
            <div class="pagination" id="collection-pagination"></div>
          </div>
        </div>
      </section>
    </main>
    <div data-cart-drawer></div>
    <div data-site-footer></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
